<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
window.toUsdz = async (url) => {
  const gltf = await loader.loadAsync(url);
  const scene = gltf.scene;
  // los materiales del atlas son de doble cara; Quick Look necesita estándar
  scene.traverse((o) => { if (o.isMesh) { const m = o.material; if (!m.isMeshStandardMaterial) { o.material = new THREE.MeshStandardMaterial({ map: m.map, normalMap: m.normalMap, roughness: 0.85 }); } o.material.side = THREE.DoubleSide; } });
  const buf = await new USDZExporter().parseAsync(scene, { quickLookCompatible: true, maxTextureSize: 1024 });
  let s = ''; const u8 = new Uint8Array(buf);
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
};
window.ready = true;
</script></body></html>
