# Brox Padel · /etc/nginx/sites-available/broxpadel  (instalar con deploy/install.sh, que reemplaza DOMINIO y la ruta)
# Solo atiende su propio dominio: no toca los otros sitios del servidor.
# Después de crear el certificado, Certbot agrega el bloque 443 a ESTE archivo.

upstream brox_web { server 127.0.0.1:3110; keepalive 16; }
upstream brox_api { server 127.0.0.1:4110; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;

    client_max_body_size 400m;   # videos subidos desde el panel
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    # archivos subidos y optimizados (fotos, videos, modelos 3D): directo del disco, caché larga
    location /media/ {
        alias RUTA/apps/api/storage/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    # AR en iPhone: Quick Look necesita el tipo model/vnd.usdz+zip (lo pone la API)
    location ~* ^/media/.+\.usdz$ {
        proxy_pass http://brox_api;
        proxy_set_header Host $host;
        expires 30d;
    }

    # la revalidación de la caché es solo interna (API → web por 127.0.0.1)
    location = /api/revalidate { return 404; }

    # API (incluye el webhook de Mercado Pago: /api/payments/mp/webhook)
    location /api/ {
        proxy_pass http://brox_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # transcodificación de videos subidos
        proxy_request_buffering off;
    }

    # tienda y panel (Next.js)
    location / {
        proxy_pass http://brox_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
